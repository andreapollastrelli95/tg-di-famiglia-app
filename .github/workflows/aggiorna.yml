name: Aggiornamento quotidiano (Cloudflare Pages)

# Il sito è pubblicato da Cloudflare Pages, collegato a questo repository: ogni push lo ricostruisce.
# Ogni mattina questo workflow chiama il "Deploy hook" di Cloudflare, così la build raccoglie
# le notizie del giorno. Il segreto CF_DEPLOY_HOOK si crea seguendo PUBBLICAZIONE.md.
on:
  schedule:
    - cron: "30 4 * * *"    # edizione del mattino: 04:30 UTC (05:30 ora solare, 06:30 ora legale)
    - cron: "30 16 * * *"   # edizione della sera: 16:30 UTC (17:30 ora solare, 18:30 ora legale)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ricostruisci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avvia la build su Cloudflare Pages
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::Manca il segreto CF_DEPLOY_HOOK (vedi PUBBLICAZIONE.md)"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Build avviata"
