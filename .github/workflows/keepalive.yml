name: Keepalive

# GitHub sospende i workflow programmati dopo 60 giorni senza attività nel
# repository. Una volta al mese questo workflow fa un piccolo commit automatico
# e riattiva esplicitamente il workflow di raccolta.
on:
  schedule:
    - cron: "17 3 1 * *"   # il giorno 1 di ogni mese
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Commit mensile
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive: $(date -u +%Y-%m)" && git push || echo "Niente da committare"
      - name: Riattiva il workflow di raccolta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable aggiorna.yml --repo "$GITHUB_REPOSITORY" || true
